name: Database checks

on:
  push:
    branches:
      - feat/mvp-foundation
    paths:
      - 'supabase/**'
      - 'src/**/*.integration.test.ts'
      - 'vitest.integration.config.ts'
      - '.github/workflows/db-tests.yml'

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Start Supabase
        run: ./node_modules/.bin/supabase start

      - name: Reset database
        run: ./node_modules/.bin/supabase db reset

      - name: Export local Supabase credentials
        shell: bash
        run: |
          eval "$(./node_modules/.bin/supabase status -o env)"
          TEST_URL="${API_URL:-${SUPABASE_URL:-http://127.0.0.1:54321}}"
          TEST_PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          TEST_SECRET_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$TEST_PUBLIC_KEY"
          test -n "$TEST_SECRET_KEY"
          {
            printf 'SUPABASE_TEST_URL=%s\n' "$TEST_URL"
            printf 'SUPABASE_TEST_PUBLIC_KEY=%s\n' "$TEST_PUBLIC_KEY"
            printf 'SUPABASE_TEST_SECRET_KEY=%s\n' "$TEST_SECRET_KEY"
          } >> "$GITHUB_ENV"

      - name: Run database tests
        run: ./node_modules/.bin/supabase test db

      - name: Run invitation integration tests
        run: ./node_modules/.bin/vitest run --config vitest.integration.config.ts
